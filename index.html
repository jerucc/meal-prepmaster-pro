<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meal PrepMaster Deluxe</title>
<style>
:root {
  --bg: #fafaf7;
  --card: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --green: #059669;
  --green-hover: #047857;
  --green-light: #ecfdf5;
  --coral: #f97316;
  --coral-hover: #ea580c;
  --line: #e2e8f0;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
}

.dark {
  --bg: #0f172a;
  --card: #1e293b;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --green: #34d399;
  --green-hover: #10b981;
  --green-light: rgba(52, 211, 153, 0.12);
  --coral: #fb923c;
  --coral-hover: #f97316;
  --line: #334155;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
}

[dir="rtl"] { direction: rtl; text-align: right; }

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: background 0.2s, color 0.2s;
  padding-bottom: 95px;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; }

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--card) 90%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.top {
  max-width: 1100px;
  margin: auto;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  font-size: 19px;
  font-weight: 850;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-icon {
  background: var(--green);
  color: white;
  padding: 6px 8px;
  border-radius: 12px;
  font-size: 16px;
}
.brand small {
  font-size: 10px;
  background: var(--coral);
  color: white;
  padding: 2px 6px;
  border-radius: 99px;
  letter-spacing: 0.5px;
}

/* Bottom Navigation Bar */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--card) 95%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px 12px;
  display: flex;
  justify-content: space-around;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
}
.bottom-btn {
  background: transparent;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 12px;
  transition: all 0.2s;
}
.bottom-btn .icon { font-size: 18px; }
.bottom-btn.active {
  color: var(--green);
  background: var(--green-light);
}

main {
  max-width: 1100px;
  margin: 16px auto;
  padding: 0 16px;
}
.tab { display: none; }
.tab.active { display: block; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

.inputrow {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
}
.inputrow input {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  color: var(--ink);
}

.primary-btn {
  background: var(--green);
  color: white;
  font-weight: 800;
  padding: 12px 20px;
  border-radius: 14px;
  width: 100%;
  font-size: 15px;
  box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
  transition: transform 0.1s, background 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.primary-btn:active { transform: scale(0.98); }
.primary-btn:hover { background: var(--green-hover); }

.accent-btn {
  background: var(--coral);
  color: white;
  font-weight: 800;
  padding: 12px 20px;
  border-radius: 14px;
  font-size: 15px;
  box-shadow: 0 4px 14px rgba(249, 115, 22, 0.25);
}
.accent-btn:hover { background: var(--coral-hover); }

.iconbtn {
  background: transparent;
  color: var(--muted);
  padding: 8px 12px;
  border-radius: 12px;
  font-weight: 700;
  border: 1px solid var(--line);
}
.iconbtn:hover { background: var(--green-light); color: var(--green); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.chip {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.chip.selected {
  background: var(--green-light);
  color: var(--green);
  border-color: var(--green);
}

.filters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-top: 16px;
}
.filters label, .field label {
  display: grid;
  gap: 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}
input, select, textarea {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  width: 100%;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}

.recipe-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
.recipe-card img { width: 100%; height: 160px; object-fit: cover; }
.recipe-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
.recipe-body h3 { margin: 0 0 6px; font-size: 17px; }
.recipe-meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.recipe-ings { font-size: 13px; margin-bottom: 14px; flex: 1; color: var(--ink); }

.daygrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}
.slot {
  border: 1px dashed var(--line);
  padding: 10px;
  border-radius: 12px;
  margin: 8px 0;
  background: var(--bg);
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal.open { display: flex; }
.modalbox {
  background: var(--card);
  border-radius: 24px;
  padding: 24px;
  width: min(550px, 100%);
  max-height: 85vh;
  overflow: auto;
}

.toast {
  position: fixed;
  bottom: 90px;
  right: 20px;
  background: #0f172a;
  color: #fff;
  padding: 12px 18px;
  border-radius: 14px;
  z-index: 60;
  box-shadow: var(--shadow);
  font-weight: 600;
}
@media (max-width: 600px) {
  .toast { right: 16px; left: 16px; text-align: center; }
}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">
      <span class="brand-icon">🍴</span> Meal PrepMaster <small>DELUXE</small>
    </div>
    <div class="row">
      <select id="langSelect" onchange="changeLanguage(this.value)" style="width: auto; padding: 6px 10px; font-size: 12px; font-weight: 700;">
        <option value="en">EN</option>
        <option value="de" selected>DE</option>
        <option value="fr">FR</option>
        <option value="it">IT</option>
        <option value="tr">TR</option>
        <option value="ar">AR</option>
      </select>
      <button class="iconbtn" onclick="openTimer()" title="Timer">⏱</button>
      <button class="iconbtn" onclick="toggleTheme()" title="Theme">🌙</button>
    </div>
  </div>
</header>

<main>
  <!-- RECIPES TAB -->
  <section class="tab active" id="tab-recipes">
    <div class="card">
      <div style="font-size: 11px; font-weight: 800; color: var(--green); letter-spacing: 0.5px;" data-t="subtitle">YOUR INTELLIGENT KITCHEN ASSISTANT</div>
      <h2 style="margin-top: 4px;" data-t="heroTitle">What would you like to cook today?</h2>
      
      <div class="inputrow">
        <input id="ingredientInput" placeholder="Enter ingredients (e.g. Pasta, Tomatoes)..." onkeydown="if(event.key==='Enter')addIngredientFromInput()">
        <button class="iconbtn" onclick="startVoiceInput()" title="Voice Command">🎙️</button>
        <button class="iconbtn" onclick="document.getElementById('photoInput').click()" title="Scan Photo">📷</button>
        <input id="photoInput" type="file" accept="image/*" hidden onchange="scanPhoto(event)">
      </div>

      <div style="margin-top: 14px; font-size: 12px; font-weight: 700; color: var(--muted);" data-t="quickSelect">QUICK SELECT INGREDIENTS:</div>
      <div class="chips" id="quickTags"></div>

      <button class="primary-btn" style="margin-top: 16px;" onclick="generateRecipesAction()">
        ✨ <span data-t="generateBtn">Generate Recipes</span> (<span id="selectedCount">0</span>)
      </button>

      <div class="filters">
        <label><span data-t="dietLabel">Diet</span>
          <select id="diet" onchange="renderRecipes()">
            <option value="all" data-t="optAllDiets">All Diets</option>
            <option value="Vegetarisch" data-t="optVeg">Vegetarian</option>
            <option value="Vegan" data-t="optVegan">Vegan</option>
            <option value="Glutenfrei" data-t="optGluten">Gluten-Free</option>
            <option value="Low-Carb" data-t="optLowCarb">Low-Carb</option>
          </select>
        </label>
        <label><span data-t="timeLabel">Max Time</span>
          <select id="time" onchange="renderRecipes()">
            <option value="all" data-t="optAnyTime">Any Time</option>
            <option value="15">15 Min</option>
            <option value="30">30 Min</option>
            <option value="45">45 Min</option>
          </select>
        </label>
        <label><span data-t="catLabel">Category</span>
          <select id="cuisine" onchange="renderRecipes()">
            <option value="all" data-t="optAllCats">All Categories</option>
            <option value="Italienisch">Italian</option>
            <option value="Mediterran">Mediterranean</option>
            <option value="Asiatisch">Asian</option>
            <option value="Klassisch">Classic</option>
            <option value="Nachtisch">🍨 Desserts</option>
          </select>
        </label>
      </div>
    </div>

    <div class="row" style="justify-content:space-between; margin-bottom: 14px;">
      <h2 style="margin:0;"><span data-t="recipesTitle">Recipes & Desserts</span> (<span id="recipeCount">0</span>)</h2>
      <button class="iconbtn" onclick="openRecipeForm()" data-t="addCustomRecipe">＋ Custom Recipe</button>
    </div>
    
    <div class="grid" id="recipes"></div>
  </section>

  <!-- WEEKLY PLANNER TAB -->
  <section class="tab" id="tab-weekly">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div>
          <h2 style="margin:0;" data-t="plannerTitle">Weekly Meal Planner</h2>
          <div style="color:var(--muted); font-size:13px;" data-t="plannerDesc">Organize your weekly meals.</div>
        </div>
        <div class="row">
          <button class="iconbtn" onclick="clearPlan()" data-t="clear">Clear</button>
          <button class="primary-btn" style="width:auto; padding:8px 14px; font-size:13px;" onclick="planToShopping()" data-t="toShopping">🛒 To Shopping List</button>
        </div>
      </div>
    </div>
    <div class="daygrid" id="week"></div>
  </section>

  <!-- SHOPPING LIST TAB -->
  <section class="tab" id="tab-shopping">
    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom: 12px;">
        <h2 style="margin:0;" data-t="shoppingTitle">Shopping List</h2>
        <div class="row">
          <button class="iconbtn" onclick="copyList()" data-t="copy">Copy</button>
          <button class="iconbtn" style="color:red;" onclick="clearChecked()" data-t="clearDone">Clear Done</button>
        </div>
      </div>
      <div class="row">
        <input id="shopInput" placeholder="Add item..." style="flex:1" onkeydown="if(event.key==='Enter')addShop()">
        <select id="shopCat" style="width:auto;">
          <option data-t="catVeg">Produce</option>
          <option data-t="catDairy">Dairy</option>
          <option data-t="catPantry">Pantry</option>
          <option data-t="catSpices">Spices</option>
          <option data-t="catDessert">Dessert</option>
          <option data-t="catOther">Other</option>
        </select>
        <button class="primary-btn" style="width:auto;" onclick="addShop()">＋</button>
      </div>
      <div id="shoppingList" style="margin-top:16px;"></div>
    </div>
  </section>

  <!-- PANTRY TAB -->
  <section class="tab" id="tab-pantry">
    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom: 12px;">
        <h2 style="margin:0;" data-t="pantryTitle">Pantry Tracker</h2>
        <button class="primary-btn" style="width:auto; font-size:13px;" onclick="openPantryForm()" data-t="addPantry">＋ Add Item</button>
      </div>
      <div style="overflow:auto">
        <table style="width:100%; border-collapse:collapse;">
          <thead>
            <tr style="border-bottom: 1px solid var(--line); text-align:left; color:var(--muted); font-size:12px;">
              <th style="padding:8px" data-t="item">Item</th>
              <th style="padding:8px" data-t="qty">Qty</th>
              <th style="padding:8px" data-t="cat">Category</th>
              <th style="padding:8px" data-t="action">Action</th>
            </tr>
          </thead>
          <tbody id="pantryList"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- COMMUNITY TAB -->
  <section class="tab" id="tab-community">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h2 style="margin:0;" data-t="communityTitle">Community & Tips</h2>
        <button class="primary-btn" style="width:auto; font-size:13px;" onclick="openPostForm()" data-t="addPost">＋ Create Post</button>
      </div>
    </div>
    <div id="posts" style="display:grid; gap:14px;"></div>
  </section>
</main>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav" id="bottomNav"></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modalbox">
    <div class="row" style="justify-content:space-between; margin-bottom:12px;">
      <h3 id="modalTitle" style="margin:0;"></h3>
      <button class="iconbtn" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" style="display:none" class="toast"></div>
