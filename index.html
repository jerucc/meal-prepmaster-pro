<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantry Chef — Recipe Ideas</title>
    <meta name="description" content="Enter ingredients you have, and get recipe ideas using Gemini AI." />
    <meta property="og:title" content="Pantry Chef — Recipe Ideas" />
    <meta property="og:description" content="Enter ingredients you have, and get recipe ideas using Gemini AI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-canvas: #f7f7f2;
        --text-main: #20251f;
        --text-muted: #5e6859;
        --brand-green: #286b45;
        --brand-green-hover: #1e5536;
        --brand-green-subtle: #edf3ed;
        --brand-green-border: #d2e0d1;
        --card-bg: #ffffff;
        --border-color: #e6e8df;
        --border-focus: #286b45;
        --chip-bg: #edf3ed;
        --accent-amber: #b45309;
        --radius-lg: 16px;
        --radius-md: 10px;
        --radius-sm: 6px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0 16px 48px;
        background-color: var(--bg-canvas);
        color: var(--text-main);
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* Navigation header */
      header {
        max-width: 740px;
        margin: 0 auto 24px;
        padding: 20px 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-color);
      }

      .logo-area {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-icon {
        width: 38px;
        height: 38px;
        background: var(--brand-green);
        color: white;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 2px 6px rgba(40, 107, 69, 0.2);
      }

      .logo-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 22px;
        font-weight: 700;
        color: #17422b;
        line-height: 1.2;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .timer-badge-btn {
        background: white;
        border: 1px solid var(--border-color);
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
      }

      .timer-badge-btn:hover {
        border-color: #c7cfc2;
        color: var(--text-main);
      }

      .timer-badge-btn.active {
        background: #fffbeb;
        border-color: #fcd34d;
        color: #92400e;
        animation: pulseTimer 1.5s infinite;
      }

      @keyframes pulseTimer {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.75; }
      }

      /* Main container */
      main {
        max-width: 740px;
        margin: 0 auto;
      }

      .hero {
        margin-bottom: 20px;
      }

      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 32px;
        font-weight: 700;
        color: #17422b;
        letter-spacing: -0.5px;
        margin-bottom: 4px;
      }

      .subtitle {
        color: var(--text-muted);
        font-size: 16px;
      }

      /* Card styling */
      .card {
        margin-top: 20px;
        padding: 24px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      }

      label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-weight: 600;
        font-size: 14px;
      }

      .label-count {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 400;
      }

      .row {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border: 1px solid #cdd2c7;
        border-radius: var(--radius-md);
        font: inherit;
        font-size: 15px;
        background: #fafbfa;
        color: var(--text-main);
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input:focus {
        background: #ffffff;
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(40, 107, 69, 0.15);
      }

      button {
        padding: 12px 20px;
        border: 0;
        border-radius: var(--radius-md);
        background: var(--brand-green);
        color: white;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: background 0.15s ease, transform 0.05s ease;
      }

      button:hover:not(:disabled) {
        background: var(--brand-green-hover);
      }

      button:active:not(:disabled) {
        transform: scale(0.98);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .secondary {
        background: #e9eee8;
        color: var(--text-main);
      }

      .secondary:hover:not(:disabled) {
        background: #dde4dc;
      }

      /* Quick staples suggestion */
      .staples-area {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid #f0f2eb;
      }

      .staples-title {
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .staples-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .staple-btn {
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 500;
        background: #fafbfa;
        color: #384235;
        border: 1px solid #e2e6dc;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .staple-btn:hover:not(:disabled) {
        background: var(--brand-green-subtle);
        border-color: var(--brand-green-border);
        color: var(--brand-green);
      }

      .staple-btn:disabled {
        opacity: 0.4;
        text-decoration: line-through;
        cursor: not-allowed;
      }

      /* Chips */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0;
        min-height: 38px;
      }

      .chips-empty {
        width: 100%;
        padding: 16px;
        border: 1px dashed #d8ded4;
        border-radius: var(--radius-md);
        text-align: center;
        font-size: 13px;
        color: var(--text-muted);
        background: #fcfdfc;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: var(--chip-bg);
        border: 1px solid var(--brand-green-border);
        color: #1a4a2f;
        font-size: 14px;
        font-weight: 500;
        border-radius: 999px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
      }

      .chip button {
        padding: 0;
        width: 18px;
        height: 18px;
        background: transparent;
        color: #43624e;
        font-size: 18px;
        line-height: 1;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .chip button:hover {
        background: rgba(0, 0, 0, 0.08);
        color: #c53030;
      }

      /* Preferences */
      .preferences-area {
        margin-bottom: 18px;
        padding-top: 12px;
        border-top: 1px solid #f0f2eb;
      }

      .pref-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .pref-pill {
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 500;
        background: #edf3ed;
        color: #384235;
        border: 1px solid transparent;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .pref-pill.selected {
        background: var(--brand-green);
        color: white;
      }

      /* Action controls */
      .action-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .clear-btn {
        background: transparent;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 500;
        padding: 8px 12px;
      }

      .clear-btn:hover {
        background: transparent;
        color: #c53030;
      }

      /* Status */
      #status {
        min-height: 24px;
        margin-top: 14px;
        font-size: 14px;
        color: var(--text-muted);
      }

      .status-box {
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-box.info {
        background: #eff6ff;
        color: #1e40af;
        border: 1px solid #bfdbfe;
      }

      .status-box.warn {
        background: #fffbeb;
        color: #92400e;
        border: 1px solid #fde68a;
      }

      .status-box.error {
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }

      /* Loading Spinner */
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Results */
      #result-card {
        margin-top: 28px;
      }

      .results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid #f0f2eb;
        flex-wrap: wrap;
        gap: 10px;
      }

      .results-header h2 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 24px;
        color: #17422b;
      }

      .view-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .segmented-ctrl {
        display: flex;
        background: #edf3ed;
        padding: 3px;
        border-radius: var(--radius-sm);
        gap: 2px;
      }

      .segmented-ctrl button {
        padding: 5px 12px;
        font-size: 12px;
        background: transparent;
        color: var(--text-muted);
        border-radius: 4px;
      }

      .segmented-ctrl button.active {
        background: white;
        color: var(--brand-green);
        box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      }

      .icon-button {
        padding: 6px 12px;
        background: #f0f3ee;
        color: var(--brand-green);
        border: 1px solid #dce3d9;
        font-size: 12px;
        border-radius: var(--radius-sm);
      }

      .icon-button:hover {
        background: #e2e8df;
      }

      /* Raw pre-wrap view */
      #raw-results {
        background: #fafbfa;
        padding: 18px;
        border: 1px solid #e8ebe3;
        border-radius: var(--radius-md);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13.5px;
        line-height: 1.6;
        white-space: pre-wrap;
        color: var(--text-main);
      }

      /* Structured Recipe Card */
      .recipe-card-item {
        background: #fafbfa;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        margin-bottom: 20px;
        overflow: hidden;
        transition: border-color 0.15s ease;
      }

      .recipe-card-item:hover {
        border-color: #c5d1bf;
      }

      .recipe-header {
        background: white;
        padding: 18px 20px;
        border-bottom: 1px solid #eef1ea;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .recipe-num-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        background: #edf3ed;
        color: var(--brand-green);
        font-size: 12px;
        font-weight: 700;
        border-radius: 50%;
        margin-right: 6px;
      }

      .recipe-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 20px;
        color: #17422b;
        font-weight: 700;
        margin-top: 4px;
      }

      .meta-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .meta-pill {
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 600;
        background: #f2f5ef;
        color: var(--text-muted);
        border-radius: var(--radius-sm);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .recipe-body {
        padding: 20px;
      }

      .section-heading {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-main);
        margin: 16px 0 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .section-heading:first-child {
        margin-top: 0;
      }

      .section-heading::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--brand-green);
      }

      .ingredients-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 8px;
      }

      .ingredient-check-item {
        background: white;
        border: 1px solid var(--border-color);
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
        transition: all 0.1s ease;
      }

      .ingredient-check-item.done {
        background: #edf3ed;
        color: #7a8376;
        text-decoration: line-through;
      }

      .steps-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .step-item {
        background: white;
        border: 1px solid var(--border-color);
        padding: 12px 14px;
        border-radius: var(--radius-md);
        font-size: 14px;
        line-height: 1.5;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        cursor: pointer;
        user-select: none;
      }

      .step-item.done {
        background: #edf3ed;
        color: #7a8376;
        text-decoration: line-through;
      }

      .step-num {
        width: 22px;
        height: 22px;
        background: #edf3ed;
        color: var(--brand-green);
        border-radius: 50%;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: 1px;
      }

      .step-item.done .step-num {
        background: var(--brand-green);
        color: white;
      }

      /* Timer Popover modal */
      #timer-popover {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: white;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 18px 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        z-index: 100;
        width: 280px;
        display: none;
      }

      .timer-display {
        font-family: ui-monospace, monospace;
        font-size: 32px;
        font-weight: 700;
        text-align: center;
        margin: 8px 0 14px;
        color: #17422b;
      }

      .timer-presets {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin-bottom: 12px;
      }

      .timer-presets button {
        padding: 4px;
        font-size: 11px;
        background: #edf3ed;
        color: var(--brand-green);
      }

      .timer-controls {
        display: flex;
        gap: 8px;
      }

      .timer-controls button {
        flex: 1;
        padding: 8px;
        font-size: 13px;
      }

      /* Footer */
      footer {
        max-width: 740px;
        margin: 40px auto 0;
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-muted);
        flex-wrap: wrap;
        gap: 10px;
      }

      @media (max-width: 580px) {
        body { padding: 0 12px 32px; }
        .row { flex-direction: column; }
        .recipe-header { flex-direction: column; }
        .ingredients-grid { grid-template-columns: 1fr; }
        #timer-popover { left: 16px; right: 16px; width: auto; bottom: 16px; }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="logo-area">
        <div class="logo-icon" aria-hidden="true">🍳</div>
        <div>
          <span class="logo-title">Pantry Chef</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="toggle-timer-btn" type="button" class="timer-badge-btn" aria-label="Open Kitchen Timer">
          ⏱️ <span id="header-timer-label">Timer</span>
        </button>
      </div>
    </header>

    <main>
      <!-- Hero -->
      <section class="hero">
        <h1>Pantry Chef</h1>
        <p class="subtitle">Enter ingredients you have, and get recipe ideas.</p>
      </section>

      <!-- Input Card -->
      <section class="card">
        <form id="ingredient-form">
          <label for="ingredient-input">
            <span>Add an ingredient</span>
            <span id="ingredient-count" class="label-count">0/30 items</span>
          </label>
          <div class="row">
            <input
              id="ingredient-input"
              maxlength="80"
              placeholder="e.g. tomatoes, garlic, pasta..."
              autocomplete="off"
            />
            <button type="submit" class="secondary">Add</button>
          </div>
        </form>

        <!-- Quick pantry suggestions -->
        <div class="staples-area">
          <div class="staples-title">Popular pantry items (tap to add):</div>
          <div id="staples-list" class="staples-list"></div>
        </div>

        <!-- Ingredients Chips List -->
        <div id="ingredients" class="chips" aria-live="polite"></div>

        <!-- Dietary / Style Preferences -->
        <div class="preferences-area">
          <div class="staples-title">Cooking Style / Preference:</div>
          <div id="preferences-list" class="pref-pills"></div>
        </div>

        <!-- Action Row -->
        <div class="action-row">
          <button id="generate-button" type="button">
            <span class="btn-text">Suggest recipes</span>
          </button>
          <button id="clear-button" type="button" class="clear-btn" style="display: none;">
            Clear all
          </button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <!-- Results Card -->
      <section id="result-card" class="card" hidden>
        <div class="results-header">
          <div>
            <h2>Recipe ideas</h2>
            <p id="results-subtitle" class="subtitle" style="font-size: 13px;">Crafted for your pantry</p>
          </div>
          <div class="view-controls">
            <div class="segmented-ctrl">
              <button id="view-cards-btn" type="button" class="active">Cards</button>
              <button id="view-raw-btn" type="button">Plain Text</button>
            </div>
            <button id="copy-all-btn" type="button" class="icon-button">Copy All</button>
          </div>
        </div>

        <!-- Formatted cards view -->
        <div id="cards-view"></div>

        <!-- Raw pre-wrap view -->
        <div id="raw-results" style="display: none;"></div>
      </section>
    </main>

    <!-- Floating Timer Popover -->
    <div id="timer-popover" role="dialog" aria-label="Kitchen Timer">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted);">Kitchen Timer</span>
        <button id="close-timer-btn" type="button" style="background: none; color: #888; font-size: 16px; padding: 0;">×</button>
      </div>
      <div id="timer-display" class="timer-display">00:00</div>
      <div class="timer-presets">
        <button type="button" data-mins="3">+3m</button>
        <button type="button" data-mins="5">+5m</button>
        <button type="button" data-mins="10">+10m</button>
        <button type="button" data-mins="15">+15m</button>
      </div>
      <div class="timer-controls">
        <button id="timer-start-pause" type="button">Start</button>
        <button id="timer-reset" type="button" class="secondary">Reset</button>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <span>Cook delightfully with what you have.</span>
      <span>Powered by Google Gemini</span>
    </footer>

    <!-- Single File Logic Script -->
    <script>
      (function () {
        const ingredients = [];
        let selectedPreference = "Any Style";
        let rawRecipesText = "";
        let currentView = "cards";

        // Popular staples
        const STAPLES = [
          "Tomatoes", "Eggs", "Garlic", "Onion",
          "Pasta", "Rice", "Olive oil", "Cheese",
          "Chicken breast", "Potatoes", "Butter", "Bell pepper"
        ];

        // Cooking style tags
        const PREFERENCES = [
          "Any Style", "Quick (< 30 min)", "Vegetarian",
          "High Protein", "Comfort Food", "One-Pot"
        ];

        // DOM elements
        const form = document.querySelector("#ingredient-form");
        const input = document.querySelector("#ingredient-input");
        const list = document.querySelector("#ingredients");
        const generateButton = document.querySelector("#generate-button");
        const clearButton = document.querySelector("#clear-button");
        const status = document.querySelector("#status");
        const resultCard = document.querySelector("#result-card");
        const rawResults = document.querySelector("#raw-results");
        const cardsView = document.querySelector("#cards-view");
        const ingredientCount = document.querySelector("#ingredient-count");
        const staplesList = document.querySelector("#staples-list");
        const preferencesList = document.querySelector("#preferences-list");
        const viewCardsBtn = document.querySelector("#view-cards-btn");
        const viewRawBtn = document.querySelector("#view-raw-btn");
        const copyAllBtn = document.querySelector("#copy-all-btn");

        // Timer elements
        const toggleTimerBtn = document.querySelector("#toggle-timer-btn");
        const timerPopover = document.querySelector("#timer-popover");
        const closeTimerBtn = document.querySelector("#close-timer-btn");
        const timerDisplay = document.querySelector("#timer-display");
        const timerStartPause = document.querySelector("#timer-start-pause");
        const timerReset = document.querySelector("#timer-reset");
        const headerTimerLabel = document.querySelector("#header-timer-label");

        let timerTotalSeconds = 0;
        let timerRunning = false;
        let timerInterval = null;

        // Render Staples
        function renderStaples() {
          staplesList.replaceChildren();
          STAPLES.forEach((item) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "staple-btn";
            btn.textContent = "+ " + item;
            const isAdded = ingredients.some((i) => i.toLowerCase() === item.toLowerCase());
            if (isAdded) btn.disabled = true;

            btn.addEventListener("click", () => {
              addIngredient(item);
            });
            staplesList.appendChild(btn);
          });
        }

        // Render Preference Pills
        function renderPreferences() {
          preferencesList.replaceChildren();
          PREFERENCES.forEach((pref) => {
            const pill = document.createElement("button");
            pill.type = "button";
            pill.className = "pref-pill" + (pref === selectedPreference ? " selected" : "");
            pill.textContent = pref;
            pill.addEventListener("click", () => {
              selectedPreference = pref;
              renderPreferences();
            });
            preferencesList.appendChild(pill);
          });
        }

        // Render Ingredients Chips
        function renderIngredients() {
          list.replaceChildren();
          ingredientCount.textContent = `${ingredients.length}/30 items`;

          if (ingredients.length === 0) {
            clearButton.style.display = "none";
            const emptyNotice = document.createElement("div");
            emptyNotice.className = "chips-empty";
            emptyNotice.textContent = "No ingredients added yet. Type above or tap popular items!";
            list.appendChild(emptyNotice);
            renderStaples();
            return;
          }

          clearButton.style.display = "inline-flex";

          ingredients.forEach((ingredient, index) => {
            const chip = document.createElement("span");
            chip.className = "chip";

            const name = document.createElement("span");
            name.textContent = ingredient;

            const remove = document.createElement("button");
            remove.type = "button";
            remove.textContent = "×";
            remove.setAttribute("aria-label", `Remove ${ingredient}`);
            remove.addEventListener("click", () => {
              ingredients.splice(index, 1);
              renderIngredients();
            });

            chip.append(name, remove);
            list.append(chip);
          });

          renderStaples();
        }

        // Add ingredient helper
        function addIngredient(val) {
          const value = val.trim();
          if (!value) return;

          if (ingredients.length >= 30) {
            showStatus("You can add up to 30 ingredients.", "warn");
            return;
          }
          if (ingredients.some((item) => item.toLowerCase() === value.toLowerCase())) {
            showStatus("That ingredient is already on your list.", "warn");
            return;
          }

          ingredients.push(value);
          showStatus("");
          renderIngredients();
        }

        function showStatus(msg, type = "info") {
          status.replaceChildren();
          if (!msg) return;

          const box = document.createElement("div");
          box.className = `status-box ${type}`;
          box.textContent = msg;
          status.appendChild(box);
        }

        // Handle Form Submit
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const value = input.value.trim();
          if (!value) return;

          addIngredient(value);
          input.value = "";
          input.focus();
        });

        // Clear all
        clearButton.addEventListener("click", () => {
          ingredients.length = 0;
          renderIngredients();
          showStatus("");
        });

        // Parse markdown recipes into structured cards
        function parseRecipes(text) {
          if (!text || !text.trim()) return [];
          const sections = text.split(/(?=###?\s+\d+[\.\:]|###?\s+Recipe\s+\d+|###?\s+[A-Z][^\n]+(?:\n\s*[-*]|\n\s*\*\*Prep))/i);
          const valid = sections.filter((s) => s.trim().length > 30);

          if (valid.length >= 2) {
            return valid.map((section, idx) => {
              const lines = section.trim().split("\n");
              const firstLine = lines[0].replace(/^#+\s*/, "").replace(/^\d+[\.\:\-]\s*/, "").replace(/\*\*/g, "").trim();
              const title = firstLine || `Recipe ${idx + 1}`;

              let prepTime = "";
              let cookTime = "";
              let servings = "";
              const ingredientsList = [];
              const stepsList = [];
              let currentSec = "";

              for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const prepM = line.match(/(?:prep(?:aration)?\s*time|prep):\s*([^\*,\n]+)/i);
                if (prepM && !prepTime) prepTime = prepM[1].trim();

                const cookM = line.match(/(?:cook(?:ing)?\s*time|cook):\s*([^\*,\n]+)/i);
                if (cookM && !cookTime) cookTime = cookM[1].trim();

                const servM = line.match(/(?:servings|yield|serves):\s*([^\*,\n]+)/i);
                if (servM && !servings) servings = servM[1].trim();

                const inlineIng = line.match(/^\*?\s*\*\*ingredients:?\*\*\s*(.+)/i);
                if (inlineIng) {
                  currentSec = "ing";
                  const items = inlineIng[1].split(/,(?![^(]*\))/);
                  items.forEach((it) => {
                    const clean = it.trim().replace(/\.$/, "");
                    if (clean) ingredientsList.push(clean);
                  });
                  continue;
                } else if (/^#*\s*\**ingredients:?/i.test(line)) {
                  currentSec = "ing";
                  continue;
                } else if (/^#*\s*\**(?:preparation|instructions|steps|directions|method):?/i.test(line)) {
                  currentSec = "step";
                  continue;
                }

                if (currentSec === "ing") {
                  const clean = line.replace(/^[-*•]\s*/, "").replace(/^\d+[\.\)]\s*/, "").trim();
                  if (clean && !clean.startsWith("**Prep") && !clean.startsWith("**Cook")) {
                    ingredientsList.push(clean);
                  }
                } else if (currentSec === "step") {
                  const clean = line.replace(/^\d+[\.\)]\s*/, "").replace(/^[-*•]\s*/, "").trim();
                  if (clean) stepsList.push(clean);
                }
              }

              return {
                title,
                prepTime,
                cookTime,
                servings,
                ingredients: ingredientsList,
                steps: stepsList,
                raw: section.trim()
              };
            });
          }

          return [{ title: "Suggested Recipes", ingredients: [], steps: [], raw: text.trim() }];
        }

        // Render recipe cards in UI
        function renderCards(recipes) {
          cardsView.replaceChildren();

          recipes.forEach((rec, idx) => {
            const card = document.createElement("article");
            card.className = "recipe-card-item";

            // Header
            const header = document.createElement("div");
            header.className = "recipe-header";

            const titleArea = document.createElement("div");
            const badge = document.createElement("span");
            badge.className = "recipe-num-badge";
            badge.textContent = String(idx + 1);

            const title = document.createElement("h3");
            title.className = "recipe-title";
            title.append(badge, document.createTextNode(rec.title));
            titleArea.appendChild(title);

            // Metadata pills
            if (rec.prepTime || rec.cookTime || rec.servings) {
              const metaDiv = document.createElement("div");
              metaDiv.className = "meta-pills";
              if (rec.prepTime) {
                const p = document.createElement("span");
                p.className = "meta-pill";
                p.textContent = "⏱️ Prep: " + rec.prepTime;
                metaDiv.appendChild(p);
              }
              if (rec.cookTime) {
                const c = document.createElement("span");
                c.className = "meta-pill";
                c.textContent = "🔥 Cook: " + rec.cookTime;
                metaDiv.appendChild(c);
              }
              if (rec.servings) {
                const s = document.createElement("span");
                s.className = "meta-pill";
                s.textContent = "👥 Serves: " + rec.servings;
                metaDiv.appendChild(s);
              }
              titleArea.appendChild(metaDiv);
            }

            // Quick actions
            const actDiv = document.createElement("div");
            actDiv.style.display = "flex";
            actDiv.style.gap = "6px";

            // Read aloud
            if ("speechSynthesis" in window) {
              const speakBtn = document.createElement("button");
              speakBtn.type = "button";
              speakBtn.className = "icon-button";
              speakBtn.textContent = "🔊 Listen";
              speakBtn.addEventListener("click", () => {
                window.speechSynthesis.cancel();
                const text = `${rec.title}. Ingredients: ${rec.ingredients.join(", ")}. Steps: ${rec.steps.join(". ")}`;
                const utter = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utter);
              });
              actDiv.appendChild(speakBtn);
            }

            // Copy single
            const copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.className = "icon-button";
            copyBtn.textContent = "📋 Copy";
            copyBtn.addEventListener("click", () => {
              navigator.clipboard.writeText(rec.raw);
              copyBtn.textContent = "✓ Copied!";
              setTimeout(() => { copyBtn.textContent = "📋 Copy"; }, 1800);
            });
            actDiv.appendChild(copyBtn);

            header.append(titleArea, actDiv);
            card.appendChild(header);

            // Body
            const body = document.createElement("div");
            body.className = "recipe-body";

            // Ingredients
            if (rec.ingredients.length > 0) {
              const ingH = document.createElement("div");
              ingH.className = "section-heading";
              ingH.textContent = "Ingredients (Click to check off)";
              body.appendChild(ingH);

              const ingGrid = document.createElement("div");
              ingGrid.className = "ingredients-grid";
              rec.ingredients.forEach((ing) => {
                const it = document.createElement("div");
                it.className = "ingredient-check-item";
                it.textContent = ing;
                it.addEventListener("click", () => {
                  it.classList.toggle("done");
                });
                ingGrid.appendChild(it);
              });
              body.appendChild(ingGrid);
            }

            // Steps
            if (rec.steps.length > 0) {
              const stpH = document.createElement("div");
              stpH.className = "section-heading";
              stpH.textContent = "Preparation Steps";
              body.appendChild(stpH);

              const stpList = document.createElement("div");
              stpList.className = "steps-list";
              rec.steps.forEach((stp, sIdx) => {
                const sEl = document.createElement("div");
                sEl.className = "step-item";

                const num = document.createElement("span");
                num.className = "step-num";
                num.textContent = String(sIdx + 1);

                const txt = document.createElement("span");
                txt.textContent = stp;

                sEl.append(num, txt);
                sEl.addEventListener("click", () => {
                  sEl.classList.toggle("done");
                });
                stpList.appendChild(sEl);
              });
              body.appendChild(stpList);
            }

            card.appendChild(body);
            cardsView.appendChild(card);
          });
        }

        // View Toggles
        viewCardsBtn.addEventListener("click", () => {
          currentView = "cards";
          viewCardsBtn.classList.add("active");
          viewRawBtn.classList.remove("active");
          cardsView.style.display = "block";
          rawResults.style.display = "none";
        });

        viewRawBtn.addEventListener("click", () => {
          currentView = "raw";
          viewRawBtn.classList.add("active");
          viewCardsBtn.classList.remove("active");
          cardsView.style.display = "none";
          rawResults.style.display = "block";
        });

        // Copy All
        copyAllBtn.addEventListener("click", () => {
          if (!rawRecipesText) return;
          navigator.clipboard.writeText(rawRecipesText);
          copyAllBtn.textContent = "✓ Copied!";
          setTimeout(() => { copyAllBtn.textContent = "Copy All"; }, 2000);
        });

        // Generate button handler
        generateButton.addEventListener("click", async () => {
          if (!ingredients.length) {
            showStatus("Add at least one ingredient first.", "warn");
            return;
          }

          generateButton.disabled = true;
          generateButton.replaceChildren();

          const spinner = document.createElement("span");
          spinner.className = "spinner";
          const text = document.createElement("span");
          text.textContent = "Creating recipe ideas…";
          generateButton.append(spinner, text);

          showStatus("Contacting Gemini Chef to craft your recipes…", "info");
          resultCard.hidden = true;

          try {
            const response = await fetch("/api/recipes", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                ingredients,
                preferences: selectedPreference !== "Any Style" ? selectedPreference : undefined
              })
            });

            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || "Request failed.");
            }

            rawRecipesText = data.recipes || "No recipes were returned.";
            rawResults.textContent = rawRecipesText;

            const parsed = parseRecipes(rawRecipesText);
            renderCards(parsed);

            resultCard.hidden = false;
            showStatus("");

            resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
          } catch (error) {
            showStatus(error.message || "Something went wrong. Please try again.", "error");
          } finally {
            generateButton.disabled = false;
            generateButton.replaceChildren();
            const btnSpan = document.createElement("span");
            btnSpan.textContent = "Suggest recipes";
            generateButton.appendChild(btnSpan);
          }
        });

        // Kitchen Timer functionality
        function updateTimerDisplay() {
          const m = Math.floor(timerTotalSeconds / 60);
          const s = timerTotalSeconds % 60;
          const formatted = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
          timerDisplay.textContent = formatted;
          headerTimerLabel.textContent = timerTotalSeconds > 0 ? formatted : "Timer";
        }

        toggleTimerBtn.addEventListener("click", () => {
          const isShown = timerPopover.style.display === "block";
          timerPopover.style.display = isShown ? "none" : "block";
        });

        closeTimerBtn.addEventListener("click", () => {
          timerPopover.style.display = "none";
        });

        // Presets
        document.querySelectorAll(".timer-presets button").forEach((b) => {
          b.addEventListener("click", () => {
            const mins = parseInt(b.getAttribute("data-mins"), 10) || 5;
            timerTotalSeconds = mins * 60;
            updateTimerDisplay();
          });
        });

        timerStartPause.addEventListener("click", () => {
          if (timerRunning) {
            clearInterval(timerInterval);
            timerRunning = false;
            timerStartPause.textContent = "Resume";
            toggleTimerBtn.classList.remove("active");
          } else {
            if (timerTotalSeconds <= 0) timerTotalSeconds = 5 * 60;
            timerRunning = true;
            timerStartPause.textContent = "Pause";
            toggleTimerBtn.classList.add("active");
            timerInterval = setInterval(() => {
              if (timerTotalSeconds <= 1) {
                clearInterval(timerInterval);
                timerRunning = false;
                timerTotalSeconds = 0;
                updateTimerDisplay();
                timerStartPause.textContent = "Start";
                toggleTimerBtn.classList.remove("active");
                alert("⏰ Cooking Timer Finished!");
                return;
              }
              timerTotalSeconds--;
              updateTimerDisplay();
            }, 1000);
          }
        });

        timerReset.addEventListener("click", () => {
          clearInterval(timerInterval);
          timerRunning = false;
          timerTotalSeconds = 0;
          updateTimerDisplay();
          timerStartPause.textContent = "Start";
          toggleTimerBtn.classList.remove("active");
        });

        // Init
        renderIngredients();
        renderPreferences();
      })();
    </script>
  </body>
</html>
