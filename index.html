<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Küchenplaner Deluxe</title>
<style>
:root {
  --bg: #fafaf7;
  --card: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --green: #10b981;
  --green-hover: #059669;
  --green-light: #ecfdf5;
  --coral: #f97316;
  --line: #e2e8f0;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
}

.dark {
  --bg: #0f172a;
  --card: #1e293b;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --green: #34d399;
  --green-hover: #10b981;
  --green-light: rgba(52, 211, 153, 0.12);
  --coral: #fb923c;
  --line: #334155;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: background 0.2s, color 0.2s;
  padding-bottom: 85px;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; }

/* Header */
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--card) 85%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.top {
  max-width: 1180px;
  margin: auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  font-size: 20px;
  font-weight: 850;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 6px;
}
.brand small {
  font-size: 10px;
  background: var(--coral);
  color: white;
  padding: 2px 6px;
  border-radius: 99px;
  letter-spacing: 0.5px;
}

/* Desktop Navigation */
nav.desktop-nav { display: flex; gap: 6px; }
.navbtn, .iconbtn {
  background: transparent;
  color: var(--muted);
  padding: 9px 14px;
  border-radius: 12px;
  font-weight: 700;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.navbtn.active, .navbtn:hover, .iconbtn:hover {
  background: var(--green-light);
  color: var(--green);
}

/* Mobile Bottom Navigation Bar */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 6px 10px;
  justify-content: space-around;
}
.bottom-btn {
  background: transparent;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 12px;
}
.bottom-btn .icon { font-size: 18px; }
.bottom-btn.active {
  color: var(--green);
  background: var(--green-light);
}

/* Layout Elements */
main {
  max-width: 1180px;
  margin: 24px auto;
  padding: 0 20px;
}
.tab { display: none; }
.tab.active { display: block; }

.hero {
  background: linear-gradient(135deg, #059669 0%, #0f172a 100%);
  color: white;
  border-radius: 24px;
  padding: 32px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.hero h1 { font-size: clamp(26px, 4vw, 42px); margin: 12px 0 8px; }
.hero p { color: #d1fae5; max-width: 650px; margin-top: 0; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.inputrow {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 8px;
  border-radius: 16px;
  margin-top: 16px;
}
.inputrow input {
  flex: 1;
  min-width: 180px;
  color: white;
  background: transparent;
  border: 0;
  outline: 0;
  padding: 10px;
}
.inputrow input::placeholder { color: #a7f3d0; }

input, select, textarea {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--green); }

.primary, .accent, .soft, .danger {
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 750;
  transition: transform 0.1s;
}
.primary:active, .accent:active, .soft:active { transform: scale(0.98); }
.primary { background: var(--green); color: white; }
.primary:hover { background: var(--green-hover); }
.accent { background: var(--coral); color: white; }
.soft { background: var(--green-light); color: var(--green); }
.danger { background: #fef2f2; color: #ef4444; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.chip {
  background: var(--green-light);
  color: var(--green);
  border-radius: 99px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.hero .chip { background: rgba(255, 255, 255, 0.18); color: white; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow);
}

.filters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin: 18px 0;
}
.filters label, .field label {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 750;
  text-transform: uppercase;
}

h2 { margin: 0 0 6px; font-size: 22px; }
h3 { margin: 0 0 10px; }
.sectionhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 24px 0 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 18px;
}

.recipe { padding: 0; overflow: hidden; }
.recipe img { width: 100%; height: 180px; object-fit: cover; background: var(--green-light); }
.recipebody { padding: 18px; }
