<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Küchenplaner Deluxe</title>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --orange: #f97316;
  --orange-hover: #ea580c;
  --orange-light: #fff7ed;
  --line: #e2e8f0;
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
}

.dark {
  --bg: #0f172a;
  --card: #1e293b;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --orange: #fb923c;
  --orange-hover: #f97316;
  --orange-light: rgba(251, 146, 60, 0.15);
  --line: #334155;
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: background 0.2s, color 0.2s;
  padding-bottom: 90px;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; }

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--card) 90%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.top {
  max-width: 1100px;
  margin: auto;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  font-size: 20px;
  font-weight: 850;
  color: var(--orange);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-icon {
  background: var(--orange);
  color: white;
  padding: 6px 8px;
  border-radius: 12px;
  font-size: 16px;
}
.brand small {
  font-size: 10px;
  background: #0f172a;
  color: white;
  padding: 2px 6px;
  border-radius: 99px;
}

nav.desktop-nav { display: flex; gap: 6px; }
.navbtn, .iconbtn {
  background: transparent;
  color: var(--muted);
  padding: 8px 12px;
  border-radius: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}
.navbtn.active, .navbtn:hover, .iconbtn:hover {
  background: var(--orange-light);
  color: var(--orange);
}

.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--card) 95%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px;
  justify-content: space-around;
}
.bottom-btn {
  background: transparent;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 12px;
}
.bottom-btn .icon { font-size: 18px; }
.bottom-btn.active {
  color: var(--orange);
  background: var(--orange-light);
}

main {
  max-width: 1100px;
  margin: 16px auto;
  padding: 0 16px;
}
.tab { display: none; }
.tab.active { display: block; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

.inputrow {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
}
.inputrow input {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  color: var(--ink);
}

.primary-btn {
  background: var(--orange);
  color: white;
  font-weight: 800;
  padding: 12px 20px;
  border-radius: 14px;
  width: 100%;
  font-size: 16px;
  box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
  transition: transform 0.1s, background 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.primary-btn:active { transform: scale(0.98); }
.primary-btn:hover { background: var(--orange-hover); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.chip {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.chip.selected {
  background: var(--orange);
  color: white;
  border-color: var(--orange);
}

.filters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 16px;
}
.filters label, .field label {
  display: grid;
  gap: 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}
input, select, textarea {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}

.recipe-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
.recipe-card img { width: 100%; height: 160px; object-fit: cover; }
.recipe-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
.recipe-body h3 { margin: 0 0 6px; font-size: 17px; }
.recipe-meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.recipe-ings { font-size: 13px; margin-bottom: 14px; flex: 1; color: var(--ink); }

.daygrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}
.slot {
  border: 1px dashed var(--line);
  padding: 10px;
  border-radius: 12px;
  margin: 8px 0;
  background: var(--bg);
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal.open { display: flex; }
.modalbox {
  background: var(--card);
  border-radius: 24px;
  padding: 24px;
  width: min(550px, 100%);
  max-height: 85vh;
  overflow: auto;
}

.toast {
  position: fixed;
  bottom: 80px;
  right: 20px;
  background: #0f172a;
  color: #fff;
  padding: 12px 18px;
  border-radius: 14px;
  z-index: 60;
  box-shadow: var(--shadow);
  font-weight: 600;
}

@media (max-width: 768px) {
  nav.desktop-nav { display: none; }
  .bottom-nav { display: flex; }
  .toast { bottom: 85px; right: 16px; left: 16px; text-align: center; }
}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">
      <span class="brand-icon">🍴</span> Küchenplaner <small>DELUXE</small>
    </div>
    <nav class="desktop-nav" id="desktopNav"></nav>
    <div class="row">
      <button class="iconbtn" onclick="openTimer()" title="Timer">⏱</button>
      <button class="iconbtn" onclick="toggleTheme()" title="Theme">🌙</button>
      <button class="iconbtn" onclick="toggleLang()" id="langBtn">DE</button>
    </div>
  </div>
</header>

<main>
  <!-- RECIPES TAB -->
  <section class="tab active" id="tab-recipes">
    <div class="card">
      <div style="font-size: 11px; font-weight: 800; color: var(--orange); letter-spacing: 0.5px;">ZUTATEN & REZEPTSTUDIO</div>
      <h2 style="margin-top: 4px;">Was möchtest du heute kochen?</h2>
      
      <div class="inputrow">
        <input id="ingredientInput" placeholder="Zutat eingeben (z.B. Pasta, Tomaten, Sahne)..." onkeydown="if(event.key==='Enter')addIngredientFromInput()">
        <button class="iconbtn" style="border:1px solid var(--line);" onclick="startVoiceInput()" title="Spracheingabe">🎙️</button>
        <button class="iconbtn" style="border:1px solid var(--line);" onclick="document.getElementById('photoInput').click()" title="Foto scannen">📷</button>
        <input id="photoInput" type="file" accept="image/*" hidden onchange="scanPhoto(event)">
      </div>

      <div style="margin-top: 14px; font-size: 12px; font-weight: 700; color: var(--muted);">SCHNELLAUSWAHL ZUTATEN:</div>
      <div class="chips" id="quickTags"></div>

      <!-- PROMINENT GENERATE BUTTON -->
      <button class="primary-btn" style="margin-top: 16px;" onclick="generateRecipesAction()">
        ✨ Rezepte generieren (<span id="selectedCount">0</span> Zutaten)
      </button>

      <div class="filters">
        <label>Ernährung
          <select id="diet" onchange="renderRecipes()">
            <option value="all">Alle Ernährungsformen</option>
            <option value="Vegetarisch">Vegetarisch</option>
            <option value="Vegan">Vegan</option>
            <option value="Glutenfrei">Glutenfrei</option>
            <option value="Low-Carb">Low-Carb</option>
          </select>
        </label>
        <label>Max. Zeit
          <select id="time" onchange="renderRecipes()">
            <option value="all">Egal wie lange</option>
            <option value="15">bis 15 Min</option>
            <option value="30">bis 30 Min</option>
            <option value="45">bis 45 Min</option>
          </select>
        </label>
        <label>Kategorie / Küche
          <select id="cuisine" onchange="renderRecipes()">
            <option value="all">Alle Kategorien</option>
            <option value="Italienisch">Italienisch</option>
            <option value="Mediterran">Mediterran</option>
            <option value="Asiatisch">Asiatisch</option>
            <option value="Klassisch">Klassisch</option>
            <option value="Nachtisch">🍨 Nachtisch & Desserts</option>
          </select>
        </label>
      </div>
    </div>

    <div class="row" style="justify-content:space-between; margin-bottom: 14px;">
      <h2 style="margin:0;">Rezepte & Desserts (<span id="recipeCount">0</span>)</h2>
      <button class="iconbtn" style="border: 1px solid var(--line);" onclick="openRecipeForm()">＋ Eigenes Rezept</button>
    </div>
    
    <div class="grid" id="recipes"></div>
  </section>

  <!-- WEEKLY PLANNER TAB -->
  <section class="tab" id="tab-weekly">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div>
          <h2 style="margin:0;">Wochenplaner</h2>
          <div style="color:var(--muted); font-size:13px;">Plane deine Mahlzeiten für die Woche.</div>
        </div>
        <div class="row">
          <button class="iconbtn" style="border:1px solid var(--line)" onclick="clearPlan()">Leeren</button>
          <button class="primary-btn" style="width:auto; padding:8px 14px; font-size:13px;" onclick="planToShopping()">🛒 Zur Einkaufsliste</button>
        </div>
      </div>
    </div>
    <div class="daygrid" id="week"></div>
  </section>

  <!-- SHOPPING LIST TAB -->
  <section class="tab" id="tab-shopping">
    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom: 12px;">
        <h2 style="margin:0;">Einkaufsliste</h2>
        <div class="row">
          <button class="iconbtn" style="border:1px solid var(--line)" onclick="copyList()">Kopieren</button>
          <button class="iconbtn" style="color:red; border:1px solid var(--line)" onclick="clearChecked()">Erledigte löschen</button>
        </div>
      </div>
      <div class="row">
        <input id="shopInput" placeholder="Artikel hinzufügen..." style="flex:1" onkeydown="if(event.key==='Enter')addShop()">
        <select id="shopCat">
          <option>Gemüse & Obst</option>
          <option>Kühlregal & Milch</option>
          <option>Vorratskammer</option>
          <option>Gewürze & Öl</option>
          <option>Süßes & Dessert</option>
          <option>Sonstiges</option>
        </select>
        <button class="primary-btn" style="width:auto;" onclick="addShop()">＋</button>
      </div>
      <div id="shoppingList" style="margin-top:16px;"></div>
    </div>
  </section>

  <!-- PANTRY TAB -->
  <section class="tab" id="tab-pantry">
    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom: 12px;">
        <h2 style="margin:0;">Vorratskammer</h2>
        <button class="primary-btn" style="width:auto; font-size:13px;" onclick="openPantryForm()">＋ Vorrat hinzufügen</button>
      </div>
      <div style="overflow:auto">
        <table style="width:100%; border-collapse:collapse;">
          <thead>
            <tr style="border-bottom: 1px solid var(--line); text-align:left; color:var(--muted); font-size:12px;">
              <th style="padding:8px">Artikel</th><th style="padding:8px">Menge</th><th style="padding:8px">Kategorie</th><th style="padding:8px">Aktion</th>
            </tr>
          </thead>
          <tbody id="pantryList"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- COMMUNITY TAB -->
  <section class="tab" id="tab-community">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h2 style="margin:0;">Community</h2>
        <button class="primary-btn" style="width:auto; font-size:13px;" onclick="openPostForm()">＋ Beitrag erstellen</button>
      </div>
    </div>
    <div id="posts" style="display:grid; gap:14px;"></div>
  </section>
</main>

<div class="bottom-nav" id="bottomNav"></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modalbox">
    <div class="row" style="justify-content:space-between; margin-bottom:12px;">
      <h3 id="modalTitle" style="margin:0;"></h3>
      <button class="iconbtn" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" style="display:none" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };

const state = {
  lang: localStorage.getItem("kp_lang") || "de",
  dark: localStorage.getItem("kp_dark") === "true",
  ingredients: ["Pasta", "Sahne", "Knoblauch", "Tomate"],
  custom: read("kp_custom", []),
  plan: read("kp_plan", Object.fromEntries(["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => [d, {breakfast:null, lunch:null, dinner:null}]))),
  shopping: read("kp_shop", [{id:"s1", name:"Tomaten", category:"Gemüse & Obst", checked:false}]),
  pantry: read("kp_pantry", [{id:"p1", name:"Mehl", qty:"1 kg", cat:"Vorratskammer"}]),
  posts: read("kp_posts", [{title:"Tipp für knusprigen Tofu", body:"Vor dem Braten mit Stärke anstäuben!", author:"ChefLena"}]),
};

const baseRecipes = [
  {id:"r1", title:"Cremige Knoblauch-Pasta", time:20, calories:520, diet:"Vegetarisch", cuisine:"Italienisch", ingredients:["Pasta","Knoblauch","Sahne","Parmesan","Butter"], steps:["Pasta in Salzwasser garen.","Knoblauch in Butter anbraten.","Sahne und Käse einrühren."], image:"https://images.unsplash.com/photo-1621996346565-e3d5d6281292?auto=format&fit=crop&w=800&q=80"},
  {id:"r2", title:"Mediterrane Gemüsepfanne", time:25, calories:380, diet:"Vegan", cuisine:"Mediterran", ingredients:["Paprika","Zucchini","Tomaten","Knoblauch","Olivenöl"], steps:["Gemüse in Scheiben schneiden.","In heißem Öl knackig anbraten."], image:"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80"},
  {id:"r3", title:"Tofu-Reis-Bowl", time:30, calories:460, diet:"Vegan", cuisine:"Asiatisch", ingredients:["Tofu","Reis","Paprika","Sojasauce","Ingwer"], steps:["Reis kochen.","Tofu kross braten und marinieren."], image:"https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=800&q=80"},
  {id:"r4", title:"Schnelles Tomaten-Omelett", time:15, calories:320, diet:"Vegetarisch", cuisine:"Klassisch", ingredients:["Eier","Tomaten","Knoblauch","Butter","Kräuter"], steps:["Eier verquirlen.","Tomaten mit Butter in der Pfanne garen."], image:"https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=800&q=80"},
  {id:"r5", title:"Beeren-Joghurt-Parfait", time:10, calories:220, diet:"Vegetarisch", cuisine:"Nachtisch", ingredients:["Joghurt","Beeren","Honig","Müsli"], steps:["Joghurt und Beeren in Gläser schichten.","Mit Honig beträufeln."], image:"https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=800&q=80"},
  {id:"r6", title:"Schoko-Tassenkuchen", time:10, calories:350, diet:"Vegetarisch", cuisine:"Nachtisch", ingredients:["Schokolade","Mehl","Zucker","Milch","Butter"], steps:["Zutaten in Tasse verrühren.","Für 90s in die Mikrowelle stellen."], image:"https://images.unsplash.com/photo-1579372786545-d24232daf58c?auto=format&fit=crop&w=800&q=80"}
];

const availableTags = ["Pasta", "Sahne", "Knoblauch", "Tomate", "Avocado", "Schokolade", "Spinat", "Feta", "Linsen", "Reis", "Paprika", "Hähnchen", "Tofu", "Beeren", "Eier"];
const days = {Mon:"Montag", Tue:"Dienstag", Wed:"Mittwoch", Thu:"Donnerstag", Fri:"Freitag", Sat:"Samstag", Sun:"Sonntag"};
const meals = {breakfast:"Frühstück", lunch:"Mittagessen", dinner:"Abendessen"};
const navItems = [["recipes", "🍳", "Rezepte"], ["weekly", "📅", "Planer"], ["shopping", "🛒", "Einkauf"], ["pantry", "📦", "Vorrat"], ["community", "👥", "Community"]];

function save() {
  localStorage.setItem("kp_custom", JSON.stringify(state.custom));
  localStorage.setItem("kp_plan", JSON.stringify(state.plan));
  localStorage.setItem("kp_shop", JSON.stringify(state.shopping));
  localStorage.setItem("kp_pantry", JSON.stringify(state.pantry));
  localStorage.setItem("kp_posts", JSON.stringify(state.posts));
}

function toast(s) {
  let t = $("toast");
  t.textContent = s;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2400);
}

function init() {
  document.documentElement.classList.toggle("dark", state.dark);
  
  $("desktopNav").innerHTML = navItems.map(([id, icon, label], i) => `<button class="navbtn ${i===0?'active':''}" onclick="tab('${id}', this)"><span>${icon}</span> ${label}</button>`).join("");
  $("bottomNav").innerHTML = navItems.map(([id, icon, label], i) => `<button class="bottom-btn ${i===0?'active':''}" onclick="tab('${id}', this)"><span class="icon">${icon}</span><span>${label}</span></button>`).join("");

  renderTags();
  renderRecipes();
  renderWeek();
  renderShopping();
  renderPantry();
  renderPosts();
}

function tab(id, btn) {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  $("tab-" + id).classList.add("active");
  document.querySelectorAll(".navbtn, .bottom-btn").forEach(x => x.classList.remove("active"));
  const idx = navItems.findIndex(x => x[0] === id);
  if (idx !== -1) {
    document.querySelectorAll(".desktop-nav .navbtn")[idx]?.classList.add("active");
    document.querySelectorAll(".bottom-nav .bottom-btn")[idx]?.classList.add("active");
  }
}

function toggleTheme() {
  state.dark = !state.dark;
  localStorage.setItem("kp_dark", state.dark);
  document.documentElement.classList.toggle("dark", state.dark);
}

function toggleLang() {
  state.lang = state.lang === "de" ? "en" : "de";
  localStorage.setItem("kp_lang", state.lang);
  $("langBtn").textContent = state.lang.toUpperCase();
  toast("Sprache gewechselt.");
}

function renderTags() {
  $("selectedCount").textContent = state.ingredients.length;
  $("quickTags").innerHTML = availableTags.map(tag => {
    let active = state.ingredients.some(x => x.toLowerCase() === tag.toLowerCase());
    return `<button class="chip ${active ? 'selected' : ''}" onclick="toggleTag('${tag}')">${tag} ${active ? '✕' : '＋'}</button>`;
  }).join("");
}

function toggleTag(tag) {
  let idx = state.ingredients.findIndex(x => x.toLowerCase() === tag.toLowerCase());
  if (idx > -1) {
    state.ingredients.splice(idx, 1);
  } else {
    state.ingredients.push(tag);
  }
  renderTags();
  renderRecipes();
}

function addIngredientFromInput() {
  let val = $("ingredientInput").value.trim();
  if (val) {
    val.split(",").forEach(x => {
      let cleaned = x.trim();
      if (cleaned && !state.ingredients.some(i => i.toLowerCase() === cleaned.toLowerCase())) {
        state.ingredients.push(cleaned);
      }
    });
    $("ingredientInput").value = "";
    renderTags();
    renderRecipes();
  }
}

function generateRecipesAction() {
  addIngredientFromInput();
  renderRecipes();
  toast("✨ Rezepte wurden neu generiert!");
}

function renderRecipes() {
  let diet = $("diet").value, time = $("time").value, cuisine = $("cuisine").value;
  let allRecipes = [...baseRecipes, ...state.custom];

  // Smart Partial Match: Match recipes containing AT LEAST 1 selected ingredient
  let matches = allRecipes.filter(r => {
    let matchDiet = (diet === "all" || r.diet === diet);
    let matchTime = (time === "all" || r.time <= +time);
    let matchCuisine = (cuisine === "all" || r.cuisine === cuisine);
    let matchIng = (!state.ingredients.length || state.ingredients.some(ing => 
      r.ingredients.some(rIng => rIng.toLowerCase().includes(ing.toLowerCase()))
    ));
    return matchDiet && matchTime && matchCuisine && matchIng;
  });

  // Dynamic Multi-Dish Synthesis: If ingredients are selected, ALWAYS generate dynamic choices
  let synthesizedDishes = generateDynamicMenuSet(state.ingredients, cuisine, diet);
  let finalDisplayList = [...matches, ...synthesizedDishes];

  if (cuisine === "Nachtisch") {
    finalDisplayList = finalDisplayList.filter(r => r.cuisine === "Nachtisch");
  }

  $("recipeCount").textContent = finalDisplayList.length;

  $("recipes").innerHTML = finalDisplayList.length ? finalDisplayList.map(r => `
    <div class="recipe-card">
      <img src="${r.image || "https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=800&q=80"}" alt="">
      <div class="recipe-body">
        <h3>${esc(r.title)}</h3>
        <div class="recipe-meta">⏱ ${r.time} Min · 🔥 ${r.calories || 420} kcal · ${esc(r.cuisine || "Kreativ")}</div>
        <div class="recipe-ings"><b>Zutaten:</b> ${(r.ingredients || []).join(", ")}</div>
        <button class="primary-btn" style="font-size:13px; padding:8px 12px;" onclick="recipeDetail('${esc(r.id)}')">Details & Kochen</button>
      </div>
    </div>
  `).join("") : `<div class="card" style="grid-column: 1/-1;">Keine Rezepte gefunden. Passe deine Zutaten oder Filter an!</div>`;
}

function generateDynamicMenuSet(ings, currentCuisine, currentDiet) {
  if (!ings.length && currentCuisine !== "Nachtisch") return [];

  let main = ings[0] ? (ings[0].charAt(0).toUpperCase() + ings[0].slice(1)) : "Kreativ";
  let second = ings[1] ? (ings[1].charAt(0).toUpperCase() + ings[1].slice(1)) : "Kräuter";

  return [
    {
      id: "gen_1",
      title: `Deftige ${main}-${second} Pfanne`,
      time: 20,
      calories: 410,
      diet: currentDiet === "all" ? "Vegetarisch" : currentDiet,
      cuisine: "Schnell & Einfach",
      ingredients: [...ings, "Olivenöl", "Salz & Pfeffer"],
      steps: ["Zutaten klein schneiden.", "In Olivenöl anbraten.", "Gut würzen und servieren."]
    },
    {
      id: "gen_2",
      title: `Cremiges ${main}-Gericht`,
      time: 25,
      calories: 450,
      diet: "Vegetarisch",
      cuisine: "Mediterran",
      ingredients: [...ings, "Sahne / Pflanzensahne", "Knoblauch"],
      steps: ["Zutaten anbraten.", "Mit Sahne ablöschen.", "5 Minuten einköcheln lassen."]
    },
    {
      id: "gen_3",
      title: `🍨 ${main}-Süßspeise / Dessert`,
      time: 15,
      calories: 290,
      diet: "Vegetarisch",
      cuisine: "Nachtisch",
      ingredients: [...ings, "Joghurt / Quark", "Honig / Zucker"],
      steps: ["Zutaten anrichten.", "Mit Joghurt verrühren und verfeinern."]
    }
  ];
}

function getAllRecipesList() {
  return [...baseRecipes, ...state.custom, ...generateDynamicMenuSet(state.ingredients, $("cuisine").value, $("diet").value)];
}

function recipeDetail(id) {
  let r = getAllRecipesList().find(x => x.id === id);
  if (!r) return;
  openModal(r.title, `
    <p style="color:var(--muted); font-size:13px;">⏱ ${r.time} Min · 🔥 ${r.calories || 420} kcal</p>
    <h4>Zutaten:</h4>
    <ul>${r.ingredients.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <h4>Zubereitung:</h4>
    <ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <button class="primary-btn" style="margin-top:14px;" onclick="recipeToShop('${esc(r.id)}')">Zutaten zur Einkaufsliste</button>
  `);
}

function recipeToShop(id) {
  let r = getAllRecipesList().find(x => x.id === id);
  if (r) {
    r.ingredients.forEach(name => state.shopping.push({id: String(Date.now() + Math.random()), name, category:"Vorratskammer", checked:false}));
    save(); renderShopping(); closeModal(); toast("Zutaten zur Einkaufsliste hinzugefügt!");
  }
}

function renderWeek() {
  $("week").innerHTML = Object.entries(days).map(([key, label]) => `
    <div class="card">
      <h3 style="margin:0 0 10px; color:var(--orange);">${label}</h3>
      ${Object.entries(meals).map(([m, ml]) => {
        let item = state.plan[key]?.[m];
        return `
          <div class="slot">
            <div style="font-size:11px; color:var(--muted); font-weight:700;">${ml}</div>
            <div style="font-weight:600; margin:4px 0;">${item ? esc(item.title) : '—'}</div>
            <button class="iconbtn" style="padding:2px 6px; font-size:11px; border:1px solid var(--line)" onclick="openMealModal('${key}','${m}')">${item ? '✏️ Ändern' : '＋ Hinzufügen'}</button>
          </div>
        `;
      }).join("")}
    </div>
  `).join("");
}

function openMealModal(day, meal) {
  let existing = state.plan[day]?.[meal]?.title || "";
  openModal(`Mahlzeit (${days[day]} - ${meals[meal]})`, `
    <div class="field">
      <label>Eigene Mahlzeit
        <input id="customMealInput" value="${esc(existing)}" placeholder="z. B. Spaghetti, Pizza...">
      </label>
      <button class="primary-btn" onclick="saveCustomMeal('${day}', '${meal}')">Speichern</button>
    </div>
  `);
}

function saveCustomMeal(day, meal) {
  let title = $("customMealInput").value.trim();
  if (title) {
    state.plan[day][meal] = { title, ingredients: [] };
    save(); renderWeek(); closeModal(); toast("Mahlzeit gespeichert!");
  }
}

function clearPlan() {
  Object.keys(state.plan).forEach(d => state.plan[d] = {breakfast:null, lunch:null, dinner:null});
  save(); renderWeek(); toast("Wochenplan geleert.");
}

function planToShopping() {
  tab("shopping");
}

function addShop() {
  let inp = $("shopInput"), cat = $("shopCat");
  if (inp.value.trim()) {
    state.shopping.push({id: String(Date.now() + Math.random()), name: inp.value.trim(), category: cat.value, checked: false});
    inp.value = ""; save(); renderShopping();
  }
}

function toggleShop(id) {
  let item = state.shopping.find(x => x.id === id);
  if (item) { item.checked = !item.checked; save(); renderShopping(); }
}

function clearChecked() {
  state.shopping = state.shopping.filter(x => !x.checked); save(); renderShopping();
}

function copyList() {
  navigator.clipboard.writeText(state.shopping.map(x => x.name).join("\n")).then(() => toast("Kopiert!"));
}

function renderShopping() {
  $("shoppingList").innerHTML = state.shopping.length ? state.shopping.map(x => `
    <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);">
      <input type="checkbox" ${x.checked ? "checked" : ""} onchange="toggleShop('${x.id}')">
      <span style="flex:1; ${x.checked ? "text-decoration:line-through; color:var(--muted)" : ""}">${esc(x.name)}</span>
    </div>
  `).join("") : `<div style="color:var(--muted)">Einkaufsliste ist leer.</div>`;
}

function openPantryForm() {
  openModal("Vorrat hinzufügen", `
    <div class="field">
      <label>Artikelname<input id="pName"></label>
      <label>Menge<input id="pQty"></label>
      <button class="primary-btn" onclick="savePantryItem()">Speichern</button>
    </div>
  `);
}

function savePantryItem() {
  let name = $("pName").value.trim(), qty = $("pQty").value.trim();
  if (name) {
    state.pantry.push({id: String(Date.now()), name, qty, cat: "Vorratskammer"});
    save(); renderPantry(); closeModal();
  }
}

function renderPantry() {
  $("pantryList").innerHTML = state.pantry.map(x => `
    <tr><td style="padding:8px">${esc(x.name)}</td><td style="padding:8px">${esc(x.qty)}</td><td style="padding:8px">${esc(x.cat)}</td><td style="padding:8px"><button onclick="deletePantry('${x.id}')">✕</button></td></tr>
  `).join("");
}

function deletePantry(id) {
  state.pantry = state.pantry.filter(x => x.id !== id); save(); renderPantry();
}

function openRecipeForm() {
  openModal("Eigenes Rezept erstellen", `
    <div class="field">
      <label>Titel<input id="rTitle"></label>
      <label>Zutaten (kommagetrennt)<input id="rIngs"></label>
      <button class="primary-btn" onclick="saveCustomRecipe()">Speichern</button>
    </div>
  `);
}

function saveCustomRecipe() {
  let title = $("rTitle").value.trim(), ings = $("rIngs").value.split(",").map(x => x.trim()).filter(Boolean);
  if (title) {
    state.custom.push({id: "c_" + Date.now(), title, time: 20, calories: 400, diet: "Vegetarisch", cuisine: "Kreativ", ingredients: ings, steps: ["Zubereiten und kochen."]});
    save(); renderRecipes(); closeModal();
  }
}

function openPostForm() {
  openModal("Beitrag erstellen", `<div class="field"><label>Titel<input id="pTitle"></label><label>Inhalt<textarea id="pBody"></textarea></label><button class="primary-btn" onclick="savePost()">Veröffentlichen</button></div>`);
}

function savePost() {
  let title = $("pTitle").value.trim(), body = $("pBody").value.trim();
  if (title && body) {
    state.posts.unshift({author: "User", title, body});
    save(); renderPosts(); closeModal();
  }
}

function renderPosts() {
  $("posts").innerHTML = state.posts.map(p => `<div class="card"><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p></div>`).join("");
}

function openTimer() {
  let mins = prompt("Timer in Minuten:", "10");
  if (mins) { toast(`Timer über ${mins} Min. gestartet!`); setTimeout(() => toast("⏰ Timer abgelaufen!"), mins * 60000); }
}

function startVoiceInput() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return toast("Spracheingabe nicht unterstützt.");
  const recognition = new SpeechRecognition();
  recognition.lang = "de-DE";
  toast("🎙️ Höre zu...");
  recognition.onresult = (e) => {
    let text = e.results[0][0].transcript;
    toast(`Erkannt: "${text}"`);
    $("ingredientInput").value = text;
    addIngredientFromInput();
  };
  recognition.start();
}

function scanPhoto(e) {
  if (e.target.files[0]) {
    toast("Foto-Scan: Zutaten wurden hinzugefügt!");
    ["Kartoffeln", "Möhren"].forEach(x => { if (!state.ingredients.includes(x)) state.ingredients.push(x); });
    renderTags(); renderRecipes();
  }
}

function openModal(title, html) {
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = html;
  $("modal").classList.add("open");
}

function closeModal() {
  $("modal").classList.remove("open");
}

function esc(s) { return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

init();
</script>
</body>
</html>
