<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meal PrepMaster Deluxe</title>
<style>
:root {
  --bg: #fafaf7;
  --card: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --green: #059669;
  --green-hover: #047857;
  --green-light: #ecfdf5;
  --coral: #f97316;
  --coral-hover: #ea580c;
  --line: #e2e8f0;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
}

.dark {
  --bg: #0f172a;
  --card: #1e293b;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --green: #34d399;
  --green-hover: #10b981;
  --green-light: rgba(52, 211, 153, 0.12);
  --coral: #fb923c;
  --coral-hover: #f97316;
  --line: #334155;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
}

[dir="rtl"] { direction: rtl; text-align: right; }

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: background 0.2s, color 0.2s;
  padding-bottom: 95px;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; }

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--card) 90%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.top {
  max-width: 1100px;
  margin: auto;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  font-size: 19px;
  font-weight: 850;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-icon {
  background: var(--green);
  color: white;
  padding: 6px 8px;
  border-radius: 12px;
  font-size: 16px;
}
.brand small {
  font-size: 10px;
  background: var(--coral);
  color: white;
  padding: 2px 6px;
  border-radius: 99px;
  letter-spacing: 0.5px;
}

/* Bottom Navigation Bar */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--card) 95%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px 12px;
  display: flex;
  justify-content: space-around;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
}
.bottom-btn {
  background: transparent;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 12px;
  transition: all 0.2s;
}
.bottom-btn .icon { font-size: 18px; }
.bottom-btn.active {
  color: var(--green);
  background: var(--green-light);
}

main {
  max-width: 1100px;
  margin: 16px auto;
  padding: 0 16px;
}
.tab { display: none; }
.tab.active { display: block; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

.inputrow {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
}
.inputrow input {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  color: var(--ink);
}

.primary-btn {
  background: var(--green);
  color: white;
  font-weight: 800;
  padding: 12px 20px;
  border-radius: 14px;
  width: 100%;
  font-size: 15px;
  box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
  transition: transform 0.1s, background 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.primary-btn:active { transform: scale(0.98); }
.primary-btn:hover { background: var(--green-hover); }

.iconbtn {
  background: transparent;
  color: var(--muted);
  padding: 8px 12px;
  border-radius: 12px;
  font-weight: 700;
  border: 1px solid var(--line);
}
.iconbtn:hover { background: var(--green-light); color: var(--green); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.chip {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.chip.selected {
  background: var(--green-light);
  color: var(--green);
  border-color: var(--green);
}

.filters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-top: 16px;
}
.filters label, .field label {
  display: grid;
  gap: 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}
input, select, textarea {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  width: 100%;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}

.recipe-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
.recipe-card img { width: 100%; height: 165px; object-fit: cover; background: var(--line); }
.recipe-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
.recipe-body h3 { margin: 0 0 6px; font-size: 17px; }
.recipe-meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.recipe-ings { font-size: 13px; margin-bottom: 14px; flex: 1; color: var(--ink); }

.daygrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}
.slot {
  border: 1px dashed var(--line);
  padding: 10px;
  border-radius: 12px;
  margin: 8px 0;
  background: var(--bg);
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal.open { display: flex; }
.modalbox {
  background: var(--card);
  border-radius: 24px;
  padding: 24px;
  width: min(550px, 100%);
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#modalBody {
  overflow-y: auto;
  padding-right: 4px;
}

.modalbox ol, .modalbox ul {
  padding-left: 20px;
  line-height: 1.6;
}
.modalbox li {
  margin-bottom: 8px;
}

.toast {
  position: fixed;
  bottom: 90px;
  right: 20px;
  background: #0f172a;
  color: #fff;
  padding: 12px 18px;
  border-radius: 14px;
  z-index: 60;
  box-shadow: var(--shadow);
  font-weight: 600;
}
@media (max-width: 600px) {
  .toast { right: 16px; left: 16px; text-align: center; }
}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">
      <span class="brand-icon">🍴</span> Meal PrepMaster <small>DELUXE</small>
    </div>
    <div class="row">
      <select id="langSelect" style="width: auto; padding: 6px 10px; font-size: 12px; font-weight: 700;">
        <option value="en">EN</option>
        <option value="de" selected>DE</option>
