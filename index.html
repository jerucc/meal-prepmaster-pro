<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meal PrepMaster Deluxe</title>
<style>
:root {
  --bg: #fafaf7;
  --card: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --green: #059669;
  --green-hover: #047857;
  --green-light: #ecfdf5;
  --coral: #f97316;
  --coral-hover: #ea580c;
  --line: #e2e8f0;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
}

.dark {
  --bg: #0f172a;
  --card: #1e293b;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --green: #34d399;
  --green-hover: #10b981;
  --green-light: rgba(52, 211, 153, 0.12);
  --coral: #fb923c;
  --coral-hover: #f97316;
  --line: #334155;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
}

[dir="rtl"] { direction: rtl; text-align: right; }

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: background 0.2s, color 0.2s;
  padding-bottom: 95px;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; }

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--card) 90%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.top {
  max-width: 1100px;
  margin: auto;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  font-size: 19px;
  font-weight: 850;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-icon {
  background: var(--green);
  color: white;
  padding: 6px 8px;
  border-radius: 12px;
  font-size: 16px;
}
.brand small {
  font-size: 10px;
  background: var(--coral);
  color: white;
  padding: 2px 6px;
  border-radius: 99px;
  letter-spacing: 0.5px;
}

/* Bottom Navigation Bar */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--card) 95%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px 12px;
  display: flex;
  justify-content: space-around;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
}
.bottom-btn {
  background: transparent;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 12px;
  transition: all 0.2s;
}
.bottom-btn .icon { font-size: 18px; }
.bottom-btn.active {
  color: var(--green);
  background: var(--green-light);
}

main {
  max-width: 1100px;
  margin: 16px auto;
  padding: 0 16px;
}
.tab { display: none; }
.tab.active { display: block; }
