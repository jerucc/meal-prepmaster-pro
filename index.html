<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meal PrepMaster Deluxe</title>
<style>
:root {
  --bg: #fafaf7;
  --card: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --green: #059669;
  --green-hover: #047857;
  --green-light: #ecfdf5;
  --coral: #f97316;
  --coral-hover: #ea580c;
  --line: #e2e8f0;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
}

.dark {
  --bg: #0f172a;
  --card: #1e293b;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --green: #34d399;
  --green-hover: #10b981;
  --green-light: rgba(52, 211, 153, 0.12);
  --coral: #fb923c;
  --coral-hover: #f97316;
  --line: #334155;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
}

[dir="rtl"] { direction: rtl; text-align: right; }

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: background 0.2s, color 0.2s;
  padding-bottom: 95px;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; }

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--card) 90%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.top {
  max-width: 1100px;
  margin: auto;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  font-size: 19px;
  font-weight: 850;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-icon {
  background: var(--green);
  color: white;
  padding: 6px 8px;
  border-radius: 12px;
  font-size: 16px;
}
.brand small {
  font-size: 10px;
  background: var(--coral);
  color: white;
  padding: 2px 6px;
  border-radius: 99px;
  letter-spacing: 0.5px;
}

/* Bottom Navigation Bar */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--card) 95%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px 12px;
  display: flex;
  justify-content: space-around;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
}
.bottom-btn {
  background: transparent;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 12px;
  transition: all 0.2s;
}
.bottom-btn .icon { font-size: 18px; }
.bottom-btn.active {
  color: var(--green);
  background: var(--green-light);
}

main {
  max-width: 1100px;
  margin: 16px auto;
  padding: 0 16px;
}
.tab { display: none; }
.tab.active { display: block; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

.inputrow {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
}
.inputrow input {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  color: var(--ink);
}

.primary-btn {
  background: var(--green);
  color: white;
  font-weight: 800;
  padding: 12px 20px;
  border-radius: 14px;
  width: 100%;
  font-size: 15px;
  box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
  transition: transform 0.1s, background 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.primary-btn:active { transform: scale(0.98); }
.primary-btn:hover { background: var(--green-hover); }

.iconbtn {
  background: transparent;
  color: var(--muted);
  padding: 8px 12px;
  border-radius: 12px;
  font-weight: 700;
  border: 1px solid var(--line);
}
.iconbtn:hover { background: var(--green-light); color: var(--green); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.chip {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.chip.selected {
  background: var(--green-light);
  color: var(--green);
  border-color: var(--green);
}

.filters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-top: 16px;
}
.filters label, .field label {
  display: grid;
  gap: 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}
input, select, textarea {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  width: 100%;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}

.recipe-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
.recipe-card img { width: 100%; height: 165px; object-fit: cover; background: var(--line); }
.recipe-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
.recipe-body h3 { margin: 0 0 6px; font-size: 17px; }
.recipe-meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.recipe-ings { font-size: 13px; margin-bottom: 14px; flex: 1; color: var(--ink); }

.daygrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}
.slot {
  border: 1px dashed var(--line);
  padding: 10px;
  border-radius: 12px;
  margin: 8px 0;
  background: var(--bg);
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal.open { display: flex; }
.modalbox {
  background: var(--card);
  border-radius: 24px;
  padding: 24px;
  width: min(550px, 100%);
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#modalBody {
  overflow-y: auto;
  padding-right: 4px;
}

.modalbox ol, .modalbox ul {
  padding-left: 20px;
  line-height: 1.6;
}
.modalbox li {
  margin-bottom: 8px;
}

.toast {
  position: fixed;
  bottom: 90px;
  right: 20px;
  background: #0f172a;
  color: #fff;
  padding: 12px 18px;
  border-radius: 14px;
  z-index: 60;
  box-shadow: var(--shadow);
  font-weight: 600;
}
@media (max-width: 600px) {
  .toast { right: 16px; left: 16px; text-align: center; }
}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">
      <span class="brand-icon">🍴</span> Meal PrepMaster <small>DELUXE</small>
    </div>
    <div class="row">
      <select id="langSelect" style="width: auto; padding: 6px 10px; font-size: 12px; font-weight: 700;">
        <option value="en">EN</option>
        <option value="de" selected>DE</option>
        <option value="fr">FR</option>
        <option value="it">IT</option>
        <option value="tr">TR</option>
        <option value="ar">AR</option>
      </select>
      <button class="iconbtn" id="btnTimer" title="Timer">⏱</button>
      <button class="iconbtn" id="btnTheme" title="Theme">🌙</button>
    </div>
  </div>
</header>

<main>
  <!-- RECIPES TAB -->
  <section class="tab active" id="tab-recipes">
    <div class="card">
      <div style="font-size: 11px; font-weight: 800; color: var(--green); letter-spacing: 0.5px;" data-t="subtitle">YOUR INTELLIGENT KITCHEN ASSISTANT</div>
      <h2 style="margin-top: 4px;" data-t="heroTitle">Was möchtest du heute kochen?</h2>
      
      <div class="inputrow">
        <input id="ingredientInput" placeholder="Zutaten eingeben (z. B. Pasta, Tomaten)...">
        <button class="iconbtn" id="btnVoice" title="Spracheingabe">🎙️</button>
        <button class="iconbtn" id="btnPhoto" title="Foto scannen">📷</button>
        <input id="photoInput" type="file" accept="image/*" hidden>
      </div>

      <div style="margin-top: 14px; font-size: 12px; font-weight: 700; color: var(--muted);" data-t="quickSelect">SCHNELLAUSWAHL ZUTATEN:</div>
      <div class="chips" id="quickTags"></div>

      <button class="primary-btn" id="btnGenerate" style="margin-top: 16px;">
        ✨ <span data-t="generateBtn">Rezepte generieren</span> (<span id="selectedCount">0</span>)
      </button>

      <div class="filters">
        <label><span data-t="dietLabel">Ernährung</span>
          <select id="diet">
            <option value="all" data-t="optAllDiets">Alle Ernährungsformen</option>
            <option value="Vegetarisch" data-t="optVeg">Vegetarisch</option>
            <option value="Vegan" data-t="optVegan">Vegan</option>
            <option value="Glutenfrei" data-t="optGluten">Glutenfrei</option>
            <option value="Low-Carb" data-t="optLowCarb">Low-Carb</option>
          </select>
        </label>
        <label><span data-t="timeLabel">Max Zeit</span>
          <select id="time">
            <option value="all" data-t="optAnyTime">Egal wie lange</option>
            <option value="15">15 Min</option>
            <option value="30">30 Min</option>
            <option value="45">45 Min</option>
          </select>
        </label>
        <label><span data-t="catLabel">Kategorie</span>
          <select id="cuisine">
            <option value="all" data-t="optAllCats">Alle Kategorien</option>
            <option value="Italienisch">Italienisch</option>
            <option value="Mediterran">Mediterran</option>
            <option value="Asiatisch">Asiatisch</option>
            <option value="Klassisch">Klassisch</option>
            <option value="Nachtisch">🍨 Desserts</option>
          </select>
        </label>
      </div>
    </div>

    <div class="row" style="justify-content:space-between; margin-bottom: 14px;">
      <h2 style="margin:0;"><span data-t="recipesTitle">Rezepte & Desserts</span> (<span id="recipeCount">0</span>)</h2>
      <button class="iconbtn" id="btnAddRecipe" data-t="addCustomRecipe">＋ Eigenes Rezept</button>
    </div>
    
    <div class="grid" id="recipes"></div>
  </section>

  <!-- WEEKLY PLANNER TAB -->
  <section class="tab" id="tab-weekly">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div>
          <h2 style="margin:0;" data-t="plannerTitle">Wochenplaner</h2>
          <div style="color:var(--muted); font-size:13px;" data-t="plannerDesc">Plane deine Mahlzeiten für die Woche.</div>
        </div>
        <div class="row">
          <button class="iconbtn" id="btnClearPlan" data-t="clear">Leeren</button>
          <button class="primary-btn" id="btnPlanToShop" style="width:auto; padding:8px 14px; font-size:13px;" data-t="toShopping">🛒 Zur Einkaufsliste</button>
        </div>
      </div>
    </div>
    <div class="daygrid" id="week"></div>
  </section>

  <!-- SHOPPING LIST TAB -->
  <section class="tab" id="tab-shopping">
    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom: 12px;">
        <h2 style="margin:0;" data-t="shoppingTitle">Einkaufsliste</h2>
        <div class="row">
          <button class="iconbtn" id="btnCopyList" data-t="copy">Kopieren</button>
          <button class="iconbtn" id="btnClearChecked" style="color:red;" data-t="clearDone">Erledigte löschen</button>
        </div>
      </div>
      <div class="row">
        <input id="shopInput" placeholder="Artikel hinzufügen..." style="flex:1">
        <select id="shopCat" style="width:auto;">
          <option data-t="catVeg">Gemüse & Obst</option>
          <option data-t="catDairy">Kühlregal</option>
          <option data-t="catPantry">Vorratskammer</option>
          <option data-t="catSpices">Gewürze</option>
          <option data-t="catDessert">Dessert</option>
          <option data-t="catOther">Sonstiges</option>
        </select>
        <button class="primary-btn" id="btnAddShop" style="width:auto;">＋</button>
      </div>
      <div id="shoppingList" style="margin-top:16px;"></div>
    </div>
  </section>

  <!-- PANTRY TAB -->
  <section class="tab" id="tab-pantry">
    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom: 12px;">
        <h2 style="margin:0;" data-t="pantryTitle">Vorratskammer</h2>
        <button class="primary-btn" id="btnAddPantry" style="width:auto; font-size:13px;" data-t="addPantry">＋ Vorrat hinzufügen</button>
      </div>
      <div style="overflow:auto">
        <table style="width:100%; border-collapse:collapse;">
          <thead>
            <tr style="border-bottom: 1px solid var(--line); text-align:left; color:var(--muted); font-size:12px;">
              <th style="padding:8px" data-t="item">Artikel</th>
              <th style="padding:8px" data-t="qty">Menge</th>
              <th style="padding:8px" data-t="cat">Kategorie</th>
              <th style="padding:8px" data-t="action">Aktion</th>
            </tr>
          </thead>
          <tbody id="pantryList"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- COMMUNITY TAB -->
  <section class="tab" id="tab-community">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h2 style="margin:0;" data-t="communityTitle">Community & Tipps</h2>
        <button class="primary-btn" id="btnAddPost" style="width:auto; font-size:13px;" data-t="addPost">＋ Beitrag erstellen</button>
      </div>
    </div>
    <div id="posts" style="display:grid; gap:14px;"></div>
  </section>
</main>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav" id="bottomNav"></div>

<div class="modal" id="modal">
  <div class="modalbox">
    <div class="row" style="justify-content:space-between; margin-bottom:12px;">
      <h3 id="modalTitle" style="margin:0;"></h3>
      <button class="iconbtn" id="btnCloseModal">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" style="display:none" class="toast"></div>

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function deduplicate(array) {
    let seen = new Set();
    return array.filter(item => {
      let lower = String(item).trim().toLowerCase();
      if (!lower || seen.has(lower)) return false;
      seen.add(lower);
      return true;
    });
  }

    document.documentElement.setAttribute("dir", state.lang === "ar" ? "rtl" : "ltr");

      if (dict[key]) el.textContent = dict[key];
    });

    if (btn) {
      btn.classList.add("active");

  function toggleTag(tag) {
    let idx = state.ingredients.findIndex(x => x.toLowerCase() === tag.toLowerCase());
    if (idx > -1) state.ingredients.splice(idx, 1);
    else state.ingredients.push(tag);
    renderTags();
    renderRecipes();
  }

        }

      $("ingredientInput").value = "";
      renderTags();
      renderRecipes();
    }
  }

  function getAllRecipesList() {
    return [...baseRecipes, ...state.custom, ...generateDynamicMenuSet(state.ingredients, $("cuisine").value, $("diet").value)];
  }

  function renderRecipes() {
    let diet = $("diet").value, time = $("time").value, cuisine = $("cuisine").value;
    let allRecipes = [...baseRecipes, ...state.custom];

    let matches = allRecipes.filter(r => {
      let matchDiet = (diet === "all" || r.diet === diet);
      let matchTime = (time === "all" || r.time <= +time);
      let matchCuisine = (cuisine === "all" || r.cuisine === cuisine);
      let matchIng = (!state.ingredients.length || state.ingredients.some(ing => 
        r.ingredients.some(rIng => rIng.toLowerCase().includes(ing.toLowerCase()))
      ));
      return matchDiet && matchTime && matchCuisine && matchIng;
    });

    let dynamicDishes = generateDynamicMenuSet(state.ingredients, cuisine, diet);
    let finalDisplayList = [...matches, ...dynamicDishes];

    if (cuisine === "Nachtisch") {
      finalDisplayList = finalDisplayList.filter(r => r.cuisine === "Nachtisch");
    }

    $("recipeCount").textContent = finalDisplayList.length;

    $("recipes").innerHTML = finalDisplayList.length ? finalDisplayList.map(r => {
      let cleanList = deduplicate(r.ingredients || []);
      return `
      <div class="recipe-card">
        <img src="${r.image}" alt="${esc(r.title)}">
        <div class="recipe-body">
          <h3>${esc(r.title)}</h3>
          <div class="recipe-meta">⏱ ${r.time} Min · 🔥 ${r.calories || 420} kcal · ${esc(r.cuisine || "Kreativ")}</div>
          <div class="recipe-ings"><b>Zutaten:</b> ${cleanList.join(", ")}</div>
          <button class="primary-btn btn-recipe-detail" data-id="${esc(r.id)}" style="font-size:13px; padding:8px 12px;">Details & Kochen</button>
        </div>
      </div>
    `;
    }).join("") : `<div class="card" style="grid-column: 1/-1;">Keine passenden Rezepte gefunden.</div>`;

    document.querySelectorAll(".btn-recipe-detail").forEach(btn => {
      btn.addEventListener("click", () => {
        recipeDetail(btn.getAttribute("data-id"));
      });
    });
  }

  function recipeDetail(id) {
    let r = getAllRecipesList().find(x => x.id === id);
    if (!r) return;
    let cleanList = deduplicate(r.ingredients || []);
    openModal(r.title, `
      <p style="color:var(--muted); font-size:13px;">⏱ ${r.time} Min · 🔥 ${r.calories || 420} kcal</p>
      <h4 style="margin-bottom:6px;">Zutaten:</h4>
      <ul>${cleanList.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <h4 style="margin-bottom:6px; margin-top:14px;">Zubereitung:</h4>
      <ol>${(r.steps || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      <button class="primary-btn" id="btnAddToShoppingModal" data-id="${esc(r.id)}" style="margin-top:18px;">Zutaten zur Einkaufsliste hinzufügen</button>
    `);

    let addBtn = $("btnAddToShoppingModal");
    if (addBtn) {
      addBtn.addEventListener("click", () => {
        recipeToShop(addBtn.getAttribute("data-id"));
      });
    }
  }

  function recipeToShop(id) {
    let r = getAllRecipesList().find(x => x.id === id);
    if (r) {
      let cleanList = deduplicate(r.ingredients || []);
      cleanList.forEach(name => state.shopping.push({id: String(Date.now() + Math.random()), name, category:"Vorratskammer", checked:false}));
      save(); renderShopping(); closeModal(); toast("Zutaten zur Einkaufsliste hinzugefügt!");

  }

      save(); renderWeek(); closeModal(); toast("Mahlzeit gespeichert!");

    if (inp.value.trim()) {

      inp.value = ""; save(); renderShopping();

    if (item) { item.checked = !item.checked; save(); renderShopping(); }

    state.shopping = state.shopping.filter(x => !x.checked); save(); renderShopping();

    $("pantryList").innerHTML = state.pantry.map(x => `
      <tr>
        <td style="padding:8px">${esc(x.name)}</td>
        <td style="padding:8px">${esc(x.qty)}</td>
        <td style="padding:8px">${esc(x.cat)}</td>
        <td style="padding:8px"><button class="iconbtn btn-del-pantry" data-id="${x.id}">✕</button></td>
      </tr>
    `).join("");

    document.querySelectorAll(".btn-del-pantry").forEach(btn => {
      btn.addEventListener("click", () => {
        deletePantry(btn.getAttribute("data-id"));
      });
    });
  }

  function deletePantry(id) {
    state.pantry = state.pantry.filter(x => x.id !== id); save(); renderPantry();
  }

  function openRecipeForm() {
    openModal("Eigenes Rezept erstellen", `
      <div class="field">
        <label>Titel<input id="rTitle"></label>
        <label>Zutaten (kommagetrennt)<input id="rIngs"></label>
        <button class="primary-btn" id="btnSaveRecipeModal">Speichern</button>
      </div>
    `);

    let saveBtn = $("btnSaveRecipeModal");
    if (saveBtn) {
      saveBtn.addEventListener("click", saveCustomRecipe);
    }
  }

  function saveCustomRecipe() {
    let title = $("rTitle").value.trim(), ings = $("rIngs").value.split(",").map(x => x.trim()).filter(Boolean);
    if (title) {
      let clean = deduplicate(ings);
      state.custom.push({
        id: "c_" + Date.now(),
        title,
        time: 20,
        calories: 400,
        diet: "Vegetarisch",
        cuisine: "Kreativ",
        ingredients: clean,
        steps: [
          "Zutaten gründlich waschen und in Stücke schneiden.",
          "In einer Pfanne mit etwas Öl anbraten.",
          "Würzen und servieren."
        ],
        image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80"
      });
      save(); renderRecipes(); closeModal(); toast("Rezept gespeichert!");
    }
  }

  function openPostForm() {
    openModal("Beitrag erstellen", `
      <div class="field">
        <label>Titel<input id="pTitle"></label>
        <label>Inhalt<textarea id="pBody"></textarea></label>
        <button class="primary-btn" id="btnSavePostModal">Veröffentlichen</button>
      </div>
    `);

    let saveBtn = $("btnSavePostModal");
    if (saveBtn) {
      saveBtn.addEventListener("click", savePost);
    }
  }

  function savePost() {
    let title = $("pTitle").value.trim(), body = $("pBody").value.trim();
    if (title && body) {
      state.posts.unshift({author: "User", title, body});
      save(); renderPosts(); closeModal(); toast("Beitrag veröffentlicht!");
    }
  }

  function renderPosts() {
    $("posts").innerHTML = state.posts.map(p => `<div class="card"><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p></div>`).join("");
  }

  function openTimer() {
    let mins = prompt("Timer in Minuten:", "10");
    if (mins) { toast(`Timer auf ${mins} Min. gestellt!`); setTimeout(() => toast("⏰ Timer abgelaufen!"), mins * 60000); }
  }

  function startVoiceInput() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return toast("Spracheingabe nicht unterstützt.");
    const recognition = new SpeechRecognition();
    recognition.lang = state.lang === "de" ? "de-DE" : "en-US";
    toast("🎙️ Höre zu...");
    recognition.onresult = (e) => {
      let text = e.results[0][0].transcript;
      toast(`Erkannt: "${text}"`);
      $("ingredientInput").value = text;
      addIngredientFromInput();
    };
    recognition.start();
  }

  function scanPhoto(e) {
    if (e.target.files[0]) {
      toast("Foto erfolgreich gescannt!");
      ["Kartoffeln", "Karotten"].forEach(x => { if (!state.ingredients.includes(x)) state.ingredients.push(x); });
      renderTags(); renderRecipes();
    }
  }

  function openModal(title, html) {
    $("modalTitle").textContent = title;
    $("modalBody").innerHTML = html;
    $("modal").classList.add("open");
  }

  function closeModal() { $("modal").classList.remove("open"); }

  function init() {
    document.documentElement.classList.toggle("dark", state.dark);
    $("langSelect").value = state.lang;
    updateLanguageUI();
    
    const navItems = [
      ["recipes", "🍳", "navRecipes"],
      ["weekly", "📅", "navPlanner"],
      ["shopping", "🛒", "navShopping"],
      ["pantry", "📦", "navPantry"],
      ["community", "👥", "navCommunity"]
    ];
    $("bottomNav").innerHTML = navItems.map(([id, icon, key], i) => `
      <button class="bottom-btn ${i===0?'active':''}" data-tab="${id}">
        <span class="icon">${icon}</span>
        <span data-t="${key}">${translations[state.lang][key]}</span>
      </button>
    `).join("");

    document.querySelectorAll(".bottom-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        tab(btn.getAttribute("data-tab"), btn);
      });
    });

    renderTags();
    renderRecipes();
    renderWeek();
    renderShopping();
    renderPantry();
    renderPosts();
  }

  // Event Listeners
  $("langSelect").addEventListener("change", (e) => changeLanguage(e.target.value));
  $("btnTimer").addEventListener("click", openTimer);
  $("btnTheme").addEventListener("click", toggleTheme);
  $("btnVoice").addEventListener("click", startVoiceInput);
  $("btnPhoto").addEventListener("click", () => $("photoInput").click());
  $("photoInput").addEventListener("change", scanPhoto);
  $("btnGenerate").addEventListener("click", generateRecipesAction);
  $("btnAddRecipe").addEventListener("click", openRecipeForm);
  $("btnClearPlan").addEventListener("click", clearPlan);
  $("btnPlanToShop").addEventListener("click", () => tab("shopping"));
  $("btnCopyList").addEventListener("click", copyList);
  $("btnClearChecked").addEventListener("click", clearChecked);
  $("btnAddShop").addEventListener("click", addShop);
  $("btnAddPantry").addEventListener("click", openPantryForm);
  $("btnAddPost").addEventListener("click", openPostForm);
  $("btnCloseModal").addEventListener("click", closeModal);

  $("ingredientInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addIngredientFromInput();
  });
  $("shopInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addShop();
  });

  $("diet").addEventListener("change", renderRecipes);
  $("time").addEventListener("change", renderRecipes);
  $("cuisine").addEventListener("change", renderRecipes);

  init();
});
</script>
</body>
</html>
